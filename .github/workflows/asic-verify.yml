name: Verilator and Nangate45

on:
  push:
    branches:
      - codex/pipelined-divider
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verilator:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes verilator tclsh python3 g++ make
      - name: Run CPU unit tests
        run: |
          mkdir -p test/cpu/build/remote
          set -o pipefail
          tclsh test/cpu/run_cpu_units.tcl 2>&1 | tee test/cpu/build/remote/cpu_units.log
      - name: Run decoder tests
        run: |
          set -o pipefail
          tclsh test/cpu/run_decoder.tcl 2>&1 | tee test/cpu/build/remote/decoder.log
      - name: Run generated and real-memory CPU programs
        run: |
          set -o pipefail
          python3 test/cpu/run_core.py --suite all 2>&1 | tee test/cpu/build/remote/core_all.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verilator-results
          path: |
            test/cpu/build/remote/
            test/cpu/build/core/*.log
            test/cpu/build/core/ipc.csv
            test/cpu/build/core/coverage.info
          if-no-files-found: warn
          retention-days: 30

  nangate45:
    needs: verilator
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DOCKER_IMAGE: openroad/orfs@sha256:31c5fd29e541059e36ad87b197ece981c04d2ce3a1f2035976fe266ec0e521cb
      ORFS_FLOW_DIR: ${{ github.workspace }}/orfs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: The-OpenROAD-Project/OpenROAD-flow-scripts
          ref: 73c804d45dc4084b05e0536dab69053b3bf9e591
          path: orfs
      - name: Run Nangate45 synthesis through CTS
        run: ./asic/run.sh cts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nangate45-reports
          path: |
            asic/work/logs/nangate45/riscv_core/base/
            asic/work/reports/nangate45/riscv_core/base/
            asic/work/results/nangate45/riscv_core/base/*.sdc
          if-no-files-found: warn
          retention-days: 30
